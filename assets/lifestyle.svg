<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
<defs>
  <linearGradient id="hero-stand" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f1f2f4"/><stop offset="1" stop-color="#b8bec8"/>
  </linearGradient>
  <linearGradient id="hero-standface" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f2f4"/>
  </linearGradient>
  <linearGradient id="hero-glow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#39a5ff"/><stop offset=".5" stop-color="#ff3ec8"/><stop offset="1" stop-color="#39a5ff"/>
  </linearGradient>
  <radialGradient id="hero-globe" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#6f7480"/><stop offset=".45" stop-color="#26292f"/><stop offset="1" stop-color="#08090b"/>
  </radialGradient>
  <radialGradient id="hero-spec" cx=".3" cy=".25" r=".35">
    <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="hero-shadow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <filter id="hero-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="hero-blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="hero-blurbig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="hero-clip"><circle cx="305" cy="285" r="84"/></clipPath>
</defs>


<defs>
  <linearGradient id="ls-room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9edf3"/><stop offset="1" stop-color="#c9d1dc"/></linearGradient>
  <linearGradient id="ls-table" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6f7f9"/><stop offset=".5" stop-color="#e5e8ee"/><stop offset="1" stop-color="#f3f4f7"/></linearGradient>
  <linearGradient id="ls-window" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6ef"/></linearGradient>
</defs>
<rect width="900" height="600" fill="url(#ls-room)"/>
<rect x="560" y="40" width="300" height="300" rx="6" fill="url(#ls-window)" opacity=".8"/>
<rect x="0" y="0" width="900" height="600" fill="#fff" opacity=".18"/>
<g opacity=".55" filter="url(#hero-blurbig)"><rect x="40" y="80" width="140" height="330" fill="#b9c2cf"/><rect x="600" y="120" width="260" height="220" fill="#f3f6fa"/></g>
<rect x="0" y="470" width="900" height="130" fill="url(#ls-table)"/>
<path d="M0,470 L900,470" stroke="#fff" stroke-width="2" opacity=".8"/>
<g opacity=".25" stroke="#aab3c0" stroke-width="1" fill="none"><path d="M60,520 C200,500 300,560 480,530 S760,560 900,520"/><path d="M0,580 C160,560 280,600 420,580 S700,590 900,570"/></g>
<!-- books -->
<g transform="translate(630 380)">
  <rect x="0" y="0" width="240" height="34" rx="3" fill="#f0efe9" stroke="#d6d4cb"/><text x="120" y="22" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="3" text-anchor="middle" fill="#3a3a3a">A BRIGHTER MIND</text>
  <rect x="10" y="36" width="240" height="34" rx="3" fill="#e9e7df" stroke="#cfcdc3"/><text x="130" y="58" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="3" text-anchor="middle" fill="#3a3a3a">A BRIGHTER WORLD</text>
  <rect x="4" y="72" width="240" height="30" rx="3" fill="#f4f3ee" stroke="#d6d4cb"/><text x="124" y="92" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="3" text-anchor="middle" fill="#8a8a8a">A BRIGHTER HOME</text>
</g>
<ellipse cx="330" cy="486" rx="190" ry="26" fill="url(#hero-shadow)"/>
<g transform="translate(120 -10) scale(1)"><!-- ambient glow -->
<path d="M342.3,166.8 A150,150 0 1 0 342.3,403.2" fill="none" stroke="url(#hero-glow)" stroke-width="70" stroke-linecap="round" opacity=".45" filter="url(#hero-blurbig)"/>
<!-- stand body -->
<path d="M367.0,135.3 A190,190 0 1 0 367.0,434.7" fill="none" stroke="#b8bec8" stroke-width="78" stroke-linecap="butt"/>
<path d="M369.4,132.1 A194,194 0 1 0 369.4,437.9" fill="none" stroke="url(#hero-stand)" stroke-width="66" stroke-linecap="butt"/>
<path d="M380.5,117.9 A212,212 0 1 0 380.5,452.1" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="butt" opacity=".5"/>
<!-- base block -->
<rect x="322" y="404" width="160" height="62" rx="8" fill="#b8bec8"/>
<rect x="326" y="400" width="154" height="58" rx="8" fill="url(#hero-standface)"/>
<rect x="326" y="400" width="154" height="14" rx="6" fill="#ffffff" opacity=".35"/>
<!-- LED strip (inner edge) -->
<path d="M341.1,168.4 A148,148 0 1 0 341.1,401.6" fill="none" stroke="url(#hero-glow)" stroke-width="18" stroke-linecap="round" opacity=".85" filter="url(#hero-blur)"/>
<path d="M341.1,168.4 A148,148 0 1 0 341.1,401.6" fill="none" stroke="url(#hero-glow)" stroke-width="6" stroke-linecap="round"/>
<path d="M341.1,168.4 A148,148 0 1 0 341.1,401.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
<!-- levitation ring -->
<g transform="rotate(-14 305 285)">
  <ellipse cx="305" cy="289" rx="118" ry="22" fill="none" stroke="#bcd6ff" stroke-width="10" opacity=".5" filter="url(#hero-blur)"/>
  <ellipse cx="305" cy="289" rx="118" ry="22" fill="none" stroke="#bcd6ff" stroke-width="2" opacity=".9"/>
</g>
<!-- globe -->
<circle cx="305" cy="285" r="98" fill="#6f7480" opacity=".35" filter="url(#hero-blur)"/>
<circle cx="305" cy="285" r="84" fill="url(#hero-globe)"/>
<g clip-path="url(#hero-clip)">
  <g transform="translate(305 285) scale(1.05)" fill="#b7bcc7" opacity=".95">
  <path d="M-52,-28 c6,-12 22,-18 34,-12 c8,4 6,14 14,16 c10,2 14,-8 24,-4 c8,4 4,16 -2,22 c-10,10 -30,6 -40,16 c-6,6 -14,4 -18,-4 c-4,-8 -16,-8 -20,-16 c-4,-8 4,-14 8,-18z"/>
  <path d="M-10,12 c10,-6 22,-2 28,8 c4,8 -2,20 -12,24 c-8,4 -16,-2 -18,-10 c-2,-8 -6,-16 2,-22z"/>
  <path d="M30,-46 c8,-4 18,0 22,8 c2,6 -4,10 -8,12 c-8,2 -18,-2 -18,-10 c0,-4 0,-8 4,-10z"/>
  <path d="M40,20 c8,-2 18,4 16,12 c-2,8 -14,10 -20,6 c-6,-4 -4,-16 4,-18z"/>
  <path d="M-72,10 c6,-6 14,-2 16,6 c2,8 -6,14 -12,10 c-6,-4 -8,-12 -4,-16z"/></g>
  <g fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1">
    <ellipse cx="305" cy="285" rx="84" ry="42"/>
    <ellipse cx="305" cy="285" rx="84" ry="71.39999999999999"/>
    <ellipse cx="305" cy="285" rx="42" ry="84"/>
    <ellipse cx="305" cy="285" rx="71.39999999999999" ry="84"/>
    <line x1="221" y1="285" x2="389" y2="285"/>
    <line x1="305" y1="201" x2="305" y2="369"/>
  </g>
</g>
<circle cx="305" cy="285" r="84" fill="url(#hero-spec)"/>
<circle cx="305" cy="285" r="84" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
<!-- front half of ring -->
<g transform="rotate(-14 305 285)">
  <path d="M187,289 A118,22 0 0 0 423,289" fill="none" stroke="#bcd6ff" stroke-width="2.5" opacity=".95"/>
</g>
</g></svg>